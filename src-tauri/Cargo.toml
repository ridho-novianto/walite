[package]
name = "walite"
version = "0.2.0"
description = "Lightweight, secure, and privacy-focused WhatsApp Web wrapper for Windows and Linux"
authors = ["Ridho Novianto"]
license = "MIT"
repository = "https://github.com/ridho-novianto/walite"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "wry", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.8.1"
winrt-toast-reborn = "0.3.8"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.52"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", default-features = false, features = ["v2_38"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

