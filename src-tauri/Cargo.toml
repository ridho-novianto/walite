[package]
name = "walite"
version = "0.1.1"
description = "Lightweight, secure, and privacy-focused WhatsApp Web wrapper for Windows"
authors = ["Ridho Novianto"]
license = "MIT"
repository = "https://github.com/ridho-novianto/walite"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

