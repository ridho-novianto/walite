<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaLite Notification</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    .toast-card {
      width: 100%;
      height: 100%;
      background: rgba(32, 44, 51, 0.95);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      color: #ffffff;
      position: relative;
      transition: all 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .toast-card:hover {
      border-color: rgba(0, 168, 132, 0.5);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 12px rgba(0, 168, 132, 0.2);
    }
    .toast-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 16px;
      margin-bottom: 8px;
    }
    .toast-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: #00a884;
      letter-spacing: 0.2px;
    }
    .toast-brand img {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }
    .toast-close-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .toast-close-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
    }
    .toast-content {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 2px;
      border-radius: 6px;
      transition: background 0.15s;
      flex: 1;
      min-height: 42px;
    }
    .toast-content:hover {
      background: rgba(255, 255, 255, 0.04);
    }
    .avatar-wrapper {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: #2a3942;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar-fallback {
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: #00a884;
      text-transform: uppercase;
    }
    .msg-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sender-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #f0f2f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.1px;
    }
    .msg-body {
      font-size: 12.5px;
      color: #aebac1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }
    .media-preview-wrapper {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      overflow: hidden;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-left: 6px;
    }
    .media-preview-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .reply-container {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .reply-input {
      flex: 1;
      height: 32px;
      background: rgba(17, 27, 33, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 0 10px;
      color: #ffffff;
      font-size: 12.5px;
      outline: none;
      transition: all 0.2s ease;
    }
    .reply-input:focus {
      border-color: #00a884;
      background: rgba(17, 27, 33, 1);
      box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.25);
    }
    .reply-input::placeholder {
      color: #8696a0;
    }
    .reply-btn {
      width: 32px;
      height: 32px;
      background: #00a884;
      border: none;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .reply-btn:hover {
      background: #06cf9c;
      transform: scale(1.04);
    }
    .reply-btn:active {
      transform: scale(0.96);
    }
    .reply-btn svg {
      width: 15px;
      height: 15px;
      fill: #111b21;
    }
    .status-sent {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #00a884;
      font-weight: 600;
      margin-top: 8px;
      padding-left: 2px;
    }
    .download-container {
      margin-top: 8px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .dl-btn {
      flex: 1;
      height: 32px;
      border: none;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .dl-btn:active {
      transform: scale(0.97);
    }
    .dl-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .dl-btn-open {
      background: #00a884;
      color: #111b21;
    }
    .dl-btn-open:hover {
      background: #06cf9c;
    }
    .dl-btn-folder {
      background: #111b21;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e9edef;
    }
    .dl-btn-folder:hover {
      background: #202c33;
      border-color: rgba(255, 255, 255, 0.3);
    }
    .call-container {
      margin-top: 8px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .call-btn {
      flex: 1;
      height: 34px;
      border: none;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .call-btn:active {
      transform: scale(0.97);
    }
    .call-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }
    .call-btn-accept {
      background: #00a884;
      color: #111b21;
      box-shadow: 0 2px 8px rgba(0, 168, 132, 0.3);
    }
    .call-btn-accept:hover {
      background: #06cf9c;
    }
    .call-btn-decline {
      background: #ea0038;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(234, 0, 56, 0.3);
    }
    .call-btn-decline:hover {
      background: #ff1a4f;
    }
  </style>
</head>

  <script>
    let currentTag = '';
    let currentTitle = '';
    let currentFilePath = '';
    let currentToastType = 'chat';
    let dismissTimer = null;

    function sendAction(action, params) {
      params = params || {};
      params._t = String(Date.now());
      try {
        const q = new URLSearchParams(params).toString();
        window.location.href = 'walite-action://' + action + (q ? ('?' + q) : '');
      } catch (e) {
        console.warn('[WaLite Toast] Action dispatch error:', e);
      }
    }

    function resetTimer(delay = 8000) {
      if (dismissTimer) clearTimeout(dismissTimer);
      dismissTimer = setTimeout(() => {
        document.getElementById('toastCard').style.display = 'none';
        sendAction('close-toast', {});
      }, delay);
    }

    window.showToast = function(title, body, icon, tag, media, isCall) {
      currentToastType = 'chat';
      currentTitle = (title || 'WhatsApp').trim();
      currentTag = tag || '';
      currentFilePath = '';

      // Strip unread badge count from title if present (e.g. "1 pesan yang belum dibacaTRI PENS" -> "TRI PENS")
      currentTitle = currentTitle.replace(/^\d+\s*(pesan yang belum dibaca|pesan belum dibaca|unread messages?|unread)\s*/i, '').trim();

      // If title is generic "WhatsApp", extract real sender name from body if present ("Sender: Message")
      let cleanBody = (body || '').trim();
      if (!currentTitle || currentTitle.toLowerCase() === 'whatsapp') {
        if (cleanBody && cleanBody.includes(':')) {
          const sepIdx = cleanBody.indexOf(':');
          const potentialSender = cleanBody.slice(0, sepIdx).trim();
          if (potentialSender.length > 0 && potentialSender.length < 50) {
            currentTitle = potentialSender.replace(/^\d+\s*(pesan yang belum dibaca|pesan belum dibaca|unread messages?|unread)\s*/i, '').trim();
            cleanBody = cleanBody.slice(sepIdx + 1).trim();
          }
        }
      }

      const card = document.getElementById('toastCard');
      card.style.display = 'flex';

      const isCallNotification = isCall === true || isCall === 'true';
      if (isCallNotification) {
        currentToastType = 'call';
        document.getElementById('brandText').textContent = 'WaLite • Panggilan Masuk';
      } else {
        document.getElementById('brandText').textContent = 'WaLite';
      }

      document.getElementById('senderTitle').textContent = currentTitle;
      document.getElementById('msgBody').textContent = cleanBody || '';
      document.getElementById('msgBody').removeAttribute('title');

      const img = document.getElementById('avatarImg');
      const fallback = document.getElementById('avatarFallback');

      if (icon && (icon.startsWith('http') || icon.startsWith('data:'))) {
        img.src = icon;
        img.style.display = 'block';
        fallback.style.display = 'none';
        img.onerror = () => {
          img.style.display = 'none';
          fallback.textContent = (currentTitle[0] || 'W').toUpperCase();
          fallback.style.display = 'flex';
          fallback.style.background = '#00a884';
        };
      } else {
        img.style.display = 'none';
        fallback.textContent = (currentTitle[0] || 'W').toUpperCase();
        fallback.style.display = 'flex';
        fallback.style.background = '#00a884';
      }

      // Sticker / GIF / Media Preview
      const mediaWrapper = document.getElementById('mediaPreviewWrapper');
      const mediaImg = document.getElementById('mediaPreviewImg');
      mediaWrapper.style.display = 'none';
      if (!isCallNotification && media && (media.startsWith('http') || media.startsWith('data:') || media.startsWith('blob:'))) {
        mediaImg.onload = () => { mediaWrapper.style.display = 'flex'; };
        mediaImg.onerror = () => { mediaWrapper.style.display = 'none'; };
        mediaImg.src = media;
      } else {
        mediaWrapper.style.display = 'none';
        mediaImg.src = '';
      }

      const replyContainer = document.getElementById('replyContainer');
      const downloadContainer = document.getElementById('downloadContainer');
      const callContainer = document.getElementById('callContainer');
      const replyInput = document.getElementById('replyInput');
      const statusSent = document.getElementById('statusSent');

      downloadContainer.style.display = 'none';
      statusSent.style.display = 'none';
      replyInput.value = '';

      if (isCallNotification) {
        replyContainer.style.display = 'none';
        callContainer.style.display = 'flex';
        resetTimer(40000);
      } else {
        callContainer.style.display = 'none';
        replyContainer.style.display = 'flex';
        if (currentTitle && currentTitle.toLowerCase() !== 'whatsapp') {
          replyInput.placeholder = 'Balas ke ' + currentTitle + '...';
        } else {
          replyInput.placeholder = 'Balas cepat...';
        }
        resetTimer(9000);
      }
    };

    window.showDownloadToast = function(fileName, filePath) {
      currentToastType = 'download';
      currentFilePath = filePath || '';
      currentTitle = fileName || 'Berkas Unduhan';
      currentTag = '';

      const card = document.getElementById('toastCard');
      card.style.display = 'flex';

      document.getElementById('brandText').textContent = 'WaLite • Unduhan';
      document.getElementById('senderTitle').textContent = 'Unduhan Selesai';
      document.getElementById('msgBody').textContent = fileName || 'Berkas telah disimpan';
      document.getElementById('msgBody').title = filePath || '';

      const img = document.getElementById('avatarImg');
      const fallback = document.getElementById('avatarFallback');
      img.style.display = 'none';

      const mediaWrapper = document.getElementById('mediaPreviewWrapper');
      if (mediaWrapper) mediaWrapper.style.display = 'none';

      const ext = (fileName && fileName.includes('.') ? fileName.split('.').pop() : 'FILE').slice(0, 4).toUpperCase();
      fallback.textContent = ext;
      fallback.style.display = 'flex';
      fallback.style.background = '#00a884';

      document.getElementById('replyContainer').style.display = 'none';
      document.getElementById('callContainer').style.display = 'none';
      document.getElementById('statusSent').style.display = 'none';
      document.getElementById('downloadContainer').style.display = 'flex';

      resetTimer(10000);
    };

    document.getElementById('btnClose').addEventListener('click', (e) => {
      e.stopPropagation();
      if (dismissTimer) clearTimeout(dismissTimer);
      document.getElementById('toastCard').style.display = 'none';
      sendAction('close-toast', {});
    });

    document.getElementById('btnOpenFile').addEventListener('click', (e) => {
      e.stopPropagation();
      if (dismissTimer) clearTimeout(dismissTimer);
      document.getElementById('toastCard').style.display = 'none';
      sendAction('open-file', { path: currentFilePath });
    });

    document.getElementById('btnOpenFolder').addEventListener('click', (e) => {
      e.stopPropagation();
      if (dismissTimer) clearTimeout(dismissTimer);
      document.getElementById('toastCard').style.display = 'none';
      sendAction('open-folder', { path: currentFilePath });
    });

    document.getElementById('btnAcceptCall').addEventListener('click', (e) => {
      e.stopPropagation();
      if (dismissTimer) clearTimeout(dismissTimer);
      document.getElementById('toastCard').style.display = 'none';
      sendAction('accept-call', {});
    });

    document.getElementById('btnDeclineCall').addEventListener('click', (e) => {
      e.stopPropagation();
      if (dismissTimer) clearTimeout(dismissTimer);
      document.getElementById('toastCard').style.display = 'none';
      sendAction('decline-call', {});
    });

    document.getElementById('contentArea').addEventListener('click', () => {
      if (dismissTimer) clearTimeout(dismissTimer);
      document.getElementById('toastCard').style.display = 'none';
      if (currentToastType === 'download') {
        sendAction('open-file', { path: currentFilePath });
      } else if (currentToastType === 'call') {
        sendAction('accept-call', {});
      } else {
        sendAction('open-chat', { title: currentTitle, tag: currentTag });
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        if (dismissTimer) clearTimeout(dismissTimer);
        document.getElementById('toastCard').style.display = 'none';
        sendAction('close-toast', {});
      }
    });

    function doSendReply() {
      const input = document.getElementById('replyInput');
      const text = (input.value || '').trim();
      if (!text) return;

      if (dismissTimer) clearTimeout(dismissTimer);

      document.getElementById('replyContainer').style.display = 'none';
      const statusSent = document.getElementById('statusSent');
      statusSent.style.display = 'flex';

      sendAction('send-reply', {
        title: currentTitle,
        tag: currentTag,
        text: text
      });

      setTimeout(() => {
        const card = document.getElementById('toastCard');
        if (card) card.style.display = 'none';
      }, 500);
    }

    document.getElementById('btnSend').addEventListener('click', (e) => {
      e.stopPropagation();
      doSendReply();
    });

    const replyInput = document.getElementById('replyInput');
    replyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        doSendReply();
      }
    });

    replyInput.addEventListener('focus', () => {
      if (dismissTimer) clearTimeout(dismissTimer);
    });

    replyInput.addEventListener('input', () => {
      if (dismissTimer) clearTimeout(dismissTimer);
    });

    replyInput.addEventListener('blur', () => {
      if (!replyInput.value) {
        resetTimer(4000);
      }
    });

    document.getElementById('toastCard').addEventListener('mouseenter', () => {
      if (dismissTimer) clearTimeout(dismissTimer);
    });

    document.getElementById('toastCard').addEventListener('mouseleave', () => {
      if (currentToastType === 'download') {
        resetTimer(5000);
      } else if (document.activeElement !== replyInput) {
        resetTimer(4000);
      }
    });
  </script>
</body>
</html>
