name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Tauri v2)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Extract Release Notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const match = changelog.match(/## \[[0-9.]+\][^\n]*\n([\s\S]*?)(?=\n## \[|$)/);
            const body = match ? match[1].trim() : "See full release notes in CHANGELOG.md.";
            const delimiter = "EOF_" + Date.now();
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n${body}\n${delimiter}\n`);
          '

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'WaLite ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

  build-linux:
    name: Build Linux (QtWebEngine AppImage)
    runs-on: ubuntu-22.04
    needs: build-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libnss3 libasound2 libfuse2 wget patchelf file desktop-file-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine pyinstaller

      - name: Bundle with PyInstaller
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          pyinstaller --onedir --windowed \
            --name walite \
            --distpath AppDir/usr/bin \
            --add-data "src-tauri/wa-privacy-panel.js:." \
            --add-data "src-tauri/icons/icon.png:icons" \
            --collect-all PyQt6.QtWebEngineCore \
            --collect-all PyQt6.QtWebEngineWidgets \
            --collect-all PyQt6.QtDBus \
            --collect-all PyQt6.QtNetwork \
            src-linux/walite.py

      - name: Prepare AppDir Layout & AppRun
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="0.2.0"

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin/walite:${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/walite:${LD_LIBRARY_PATH}"
          export QTWEBENGINEPROCESS_PATH="${HERE}/usr/bin/walite/PyQt6/Qt6/libexec/QtWebEngineProcess"
          exec "${HERE}/usr/bin/walite/walite" "$@"
          EOF
          chmod +x AppDir/AppRun

          cp src-linux/id.my.vianto06.walite.desktop AppDir/id.my.vianto06.walite.desktop
          sed -i 's|Exec=.*|Exec=walite|' AppDir/id.my.vianto06.walite.desktop
          sed -i 's|Icon=.*|Icon=walite|' AppDir/id.my.vianto06.walite.desktop
          cp AppDir/id.my.vianto06.walite.desktop AppDir/walite.desktop

          cp src-tauri/icons/128x128@2x.png AppDir/walite.png
          cp src-tauri/icons/128x128@2x.png AppDir/.DirIcon

      - name: Package AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="0.2.0"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir "WaLite_${VERSION}_amd64.AppImage"

      - name: Package Portable Tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="0.2.0"
          TAR_DIR="WaLite_${VERSION}_linux_x86_64"
          mkdir -p "$TAR_DIR"
          cp -r AppDir/usr/bin/walite/* "$TAR_DIR/"
          cp src-linux/run.sh "$TAR_DIR/"
          cp src-linux/id.my.vianto06.walite.desktop "$TAR_DIR/"
          tar -czvf "WaLite_${VERSION}_linux_x86_64.tar.gz" "$TAR_DIR"

      - name: Upload Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            WaLite_*_amd64.AppImage
            WaLite_*_linux_x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
